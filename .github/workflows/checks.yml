name: Check toolkit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install -g agent-browser@0.35.1
      - run: agent-browser install --with-deps
      # Permit Chromium's user-namespace sandbox on this disposable Ubuntu runner.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: node --test test/browser.test.mjs
